[project]
name = "stormdb-catalog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lubell", email = "jameslubell@berkeley.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=2.3.3",
    "requests>=2.34.2",
]

[project.scripts]
stormdb-catalog = "stormdb_catalog.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
